
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check src

      - name: Run tests
        run: pytest -v

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image for security scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          no-cache: true
          tags: ai381-lab2:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai381-lab2:scan
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/ai381-lab2:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Checking image..."
          docker image inspect ai381-lab2:scan

          echo "Tagging image..."
          docker tag ai381-lab2:scan "$IMAGE"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"

            if docker push "$IMAGE"; then
              echo "Image pushed successfully!"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push failed. Retrying in $((attempt * 10)) seconds..."
              sleep $((attempt * 10))
            fi
          done

          echo "Image push failed after 3 attempts."
          exit 1
